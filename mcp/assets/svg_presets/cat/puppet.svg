<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" id="puppet">
  <!-- Body -->
  <ellipse id="body" cx="200" cy="320" rx="80" ry="50" fill="#d2691e"/>
  <!-- Ears -->
  <polygon points="120,100 100,40 170,90" fill="#f4a460"/>
  <polygon points="280,100 300,40 230,90" fill="#f4a460"/>
  <polygon points="125,90 110,55 160,85" fill="#ffb6c1"/>
  <polygon points="275,90 290,55 240,85" fill="#ffb6c1"/>
  <!-- Head -->
  <circle id="head" cx="200" cy="180" r="110" fill="#f4a460"/>
  <!-- Left eye -->
  <ellipse id="left-eye" cx="160" cy="160" rx="15" ry="20" fill="#2ecc71"/>
  <!-- Right eye -->
  <ellipse id="right-eye" cx="240" cy="160" rx="15" ry="20" fill="#2ecc71"/>
  <!-- Pupils -->
  <ellipse cx="160" cy="165" rx="5" ry="15" fill="#1a1a2e"/>
  <ellipse cx="240" cy="165" rx="5" ry="15" fill="#1a1a2e"/>
  <!-- Nose -->
  <polygon points="195,200 205,200 200,210" fill="#c0392b"/>
  <!-- Mouth (animated via scaleY) -->
  <ellipse id="mouth" cx="200" cy="230" rx="25" ry="6" fill="#c0392b" style="transform-origin: 200px 230px; transform: scaleY(0.1)"/>
  <!-- Whiskers -->
  <line x1="140" y1="220" x2="90" y2="215" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="140" y1="230" x2="90" y2="235" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="260" y1="220" x2="310" y2="215" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="260" y1="230" x2="310" y2="235" stroke="#1a1a2e" stroke-width="2"/>
</svg>
