[package]
name = "openscript-tts"
version = "0.1.0"
edition = "2021"

[features]
default = ["sidecar"]
sidecar = []
# Native Kokoro TTS backend (preset-voice, ONNX-based). When enabled, the
# `kokoro` module is compiled in and the MCP TTS layer can route requests to
# Kokoro for supported languages (en, zh, ja, etc.). Uses the kokoro-onnx
# Python sidecar (mcp/scripts/kokoro_tts_sidecar.py) for ONNX inference.
kokoro = []

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
base64 = "0.22"
chrono = { workspace = true }
hound = "3.5"

[dev-dependencies]
filetime = "0.2"
