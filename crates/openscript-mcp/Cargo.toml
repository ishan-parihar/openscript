[package]
name = "openscript-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-server"
path = "src/bin/mcp-server.rs"

[features]
default = ["sidecar", "kokoro"]
sidecar = []
# Enables native Kokoro TTS backend (preset-voice, ONNX-based). When enabled,
# the TTS tool layer routes requests to Kokoro for profiles with provider="kokoro".
# Enabled by default — the golden trajectory (script.to_video) requires Kokoro
# for TTS generation. Without this feature, script.to_video fails at the
# TTS step with "rebuild with --features kokoro".
kokoro = ["openscript-tts/kokoro"]

[dependencies]
openscript-core = { path = "../openscript-core" }
openscript-ffmpeg = { path = "../openscript-ffmpeg" }
openscript-transcribe = { path = "../openscript-transcribe" }
openscript-tts = { path = "../openscript-tts" }
openscript-assets = { path = "../openscript-assets" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
urlencoding = "2.1"
reqwest = { workspace = true }
