<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="OpenScript pipeline: script.json enters script.to_video and emerges as final.mp4 with TTS voice, word captions, b-roll, stickers and music">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">OpenScript</text>
  <text x="64" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">A script becomes a narrated, captioned, b-roll'd video — one MCP call.</text>

  <!-- script.json -->
  <rect x="64" y="148" width="220" height="84" rx="16" fill="#151f36" stroke="#2b3b5e" stroke-width="2"/>
  <text x="174" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="600" fill="#c7d2fe">script.json</text>
  <text x="174" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#64748b">scenes · speakers · captions</text>

  <!-- arrow 1 -->
  <line x1="288" y1="190" x2="356" y2="190" stroke="#475569" stroke-width="3"/>
  <polygon points="356,190 344,183 344,197" fill="#475569"/>

  <!-- to_video orchestrator -->
  <rect x="360" y="136" width="480" height="108" rx="16" fill="url(#acc)" opacity="0.16"/>
  <rect x="360" y="136" width="480" height="108" rx="16" fill="none" stroke="#818cf8" stroke-width="2"/>
  <text x="600" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="26" font-weight="700" fill="#e0e7ff">script.to_video</text>
  <text x="600" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#cbd5e1">TTS voice · word captions · b-roll · stickers · music</text>

  <!-- arrow 2 -->
  <line x1="844" y1="190" x2="912" y2="190" stroke="#475569" stroke-width="3"/>
  <polygon points="912,190 900,183 900,197" fill="#475569"/>

  <!-- final.mp4 -->
  <rect x="916" y="148" width="220" height="84" rx="16" fill="#151f36" stroke="#2b3b5e" stroke-width="2"/>
  <text x="1026" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="600" fill="#a7f3d0">final.mp4</text>
  <text x="1026" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#64748b">9:16 · captions burned in</text>

  <!-- lane chips -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">
    <rect x="64" y="254" width="160" height="30" rx="15" fill="#1c2a45"/>
    <text x="144" y="274" text-anchor="middle" fill="#93c5fd">Audio8 · Kokoro</text>
    <rect x="236" y="254" width="140" height="30" rx="15" fill="#1c2a45"/>
    <text x="306" y="274" text-anchor="middle" fill="#fca5a5">ASS captions</text>
    <rect x="388" y="254" width="150" height="30" rx="15" fill="#1c2a45"/>
    <text x="463" y="274" text-anchor="middle" fill="#fcd34d">Pexels · yt-dlp</text>
    <rect x="550" y="254" width="150" height="30" rx="15" fill="#1c2a45"/>
    <text x="625" y="274" text-anchor="middle" fill="#c4b5fd">GIPHY stickers</text>
    <rect x="712" y="254" width="140" height="30" rx="15" fill="#1c2a45"/>
    <text x="782" y="274" text-anchor="middle" fill="#86efac">Ducked music</text>
    <rect x="864" y="254" width="180" height="30" rx="15" fill="#1c2a45"/>
    <text x="954" y="274" text-anchor="middle" fill="#e2e8f0">verify.production</text>
    <rect x="1056" y="254" width="80" height="30" rx="15" fill="#22304f"/>
    <text x="1096" y="274" text-anchor="middle" fill="#94a3b8">100/100</text>
  </g>
</svg>
