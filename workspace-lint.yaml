project:
  name: "openscript"
  type: "rust-content-creation"

structure:
  canonical:
    - path: "crates"
      purpose: "Crate workspace"
    - path: "docs"
      purpose: "Documentation, audits, and plans"
    - path: "scripts"
      purpose: "Utility scripts"
    - path: "skills"
      purpose: "AI agent skills"
    - path: "assets"
      purpose: "Assets"

rules:
  root:
    forbidden_files:
      - "*.log"
      - "*.bak"
      - "*.tmp"
      - "*.old"
      - "*.orig"
      - "*.rej"
      - "*.swp"
      - "*.pid"
      - "*.out"
      - "*.err"
      - "*~"
      - "AUDIT*"
      - "PLAN*"
      - "*REPORT*"
      - "*_v[0-9]*"
      - "*ROADMAP*"
      - "*GUIDE*"
      - "*UPGRADE*"
      - "*DIAGNOSTICS*"
      - "*INTELLIGENCE*"
      - "TOOL_ANALYSIS*"
      - "IMPLEMENTATION_*"
      - "AGENT_GUIDE*"
      - "error.log"
      - "lifeos.config.json"
    allowed_root_files:
      - ".clippy.toml"
      - ".editorconfig"
      - ".env.example"
      - ".eslintrc*"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - ".impeccable.md"
      - ".node-version"
      - ".nvmrc"
      - ".oh-my-opencode-pi-stats.json"
      - ".prettierrc*"
      - ".python-version"
      - ".rustfmt.toml"
      - "AGENTS.md"
      - "BUGS.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "COPYING"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "FRESH_AGENT_AUDIT_PROTOCOL.md"
