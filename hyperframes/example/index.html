<!DOCTYPE html>
<html lang="en" data-composition-id="example" data-start="0" data-duration="3" data-fps="30" data-width="1920" data-height="1080">
<head>
  <meta charset="utf-8" />
  <title>OpenScript — HyperFrames Example</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #f8fafc;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }
    .title {
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -0.03em;
      opacity: 0;
      transform: translateY(40px);
    }
    .subtitle {
      font-size: 36px;
      font-weight: 400;
      color: #94a3b8;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="scene" data-start="0" data-duration="3" data-track-index="0">
      <div class="title">OpenScript</div>
      <div class="subtitle">HyperFrames Composition</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to(".title", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2)
      .to(".subtitle", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.8);
    window.__timelines = window.__timelines || {};
    window.__timelines["example"] = tl;
  </script>
</body>
</html>
